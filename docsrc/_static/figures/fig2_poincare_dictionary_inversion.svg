    <path class="guide-line" data-ref="/ C U /" d="M 317.11 86.24 L 352.96 181.48 L 388.82 276.73"/>
    <path class="featured-arc" data-ref="( U V )" d="M 388.82 276.73 A 203.54 203.54 0 0 1 284.06 287.08 A 203.54 203.54 0 0 1 188.14 243.7"><title>Hyperbolic geodesic arc UV orthogonal to Ω</title></path>
  </g>
  <g id="highlights"></g>
