<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" id="fig2_poincare_dictionary_inversion" data-graphic-id="fig2_poincare_dictionary_inversion" viewBox="0 0 680 500" role="img" aria-label="Poincaré&#x27;s Translation Dictionary and horizon circle inversion P to P*">
  <style>
.euclid-graphic { font-family: "Inter", "Fira Sans", "Segoe UI", sans-serif; }
  .euclid-graphic .svg-bg { fill: #fafaf9; }
