    <text class="geom-caption" x="340" y="490" text-anchor="middle">Fig. 2 — Ch. III: Poincaré&#x27;s Dictionary — Horizon Inversion OP·OP* = 1 &amp; Orthogonal Geodesic Circle (P, Q, P*)</text>
  </g>
