<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" id="fig3_lobachevsky_parallels" data-graphic-id="fig3_lobachevsky_parallels" viewBox="0 0 660 520" role="img" aria-label="Lobachevsky limiting horoparallels and ultraparallels violating Euclid Postulate V">
